name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Ruff
        run: |
          python -m pip install --quiet ruff==0.15.17
          ruff check .

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]

    defaults:
      run:
        shell: bash -el {0}

    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Provision PyMOL and dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ci/environment.yml
          environment-name: proteinct-ci
          cache-environment: true
          cache-downloads: true

      - name: Record the environment under test
        run: |
          micromamba list
          python -c "import sys, pymol, numpy, pandas, matplotlib, Bio; \
            from PyQt5.QtCore import QT_VERSION_STR; \
            print('python  ', sys.version.split()[0]); \
            print('pymol   ', pymol.cmd.get_version()[0]); \
            print('numpy   ', numpy.__version__); \
            print('pandas  ', pandas.__version__); \
            print('mpl     ', matplotlib.__version__); \
            print('biopython', Bio.__version__); \
            print('Qt      ', QT_VERSION_STR)"

      - name: Export a checksummed lock file
        run: python ci/make_lock.py --from-prefix "$CONDA_PREFIX"

      - name: Upload the lock file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conda-lock-${{ matrix.os }}
          path: ci/conda-lock-*.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Run test suite
        run: pytest -v --durations=10

      - name: Reproduce the published artefacts
        run: |
          pymol -cqy reproduce.pml
          test -f reproduce_out/csv/psxresults.csv

      - name: Upload the reproduction output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-${{ matrix.os }}
          path: reproduce_out/**
          retention-days: 90
          if-no-files-found: warn

      - name: Upload the figure gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures-${{ matrix.os }}
          path: tests/_artifacts/**
          retention-days: 90
          if-no-files-found: warn
