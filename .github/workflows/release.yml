name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build plugin package
        id: package
        env:
          ASSET_NAME: protein-circuit-topology-pymol-plugin.zip
        run: |
          bash ci/build_plugin_zip.sh "${ASSET_NAME}"

          echo "zip_file=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Publish download links
        env:
          ASSET_NAME: protein-circuit-topology-pymol-plugin.zip
        run: |
          {
            echo "Latest download: https://github.com/${{ github.repository }}/releases/latest/download/${ASSET_NAME}"
            echo "Versioned release page: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.zip_file }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
