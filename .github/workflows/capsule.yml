name: Capsule

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    paths:
      - "capsule/**"
      - "ci/environment.yml"
      - "reproduce.pml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and verify the capsule
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/proteinct-plugin
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build (runs reproduce.pml inside the image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: capsule/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run the capsule and keep its output
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          mkdir -p capsule_out
          docker run --rm -v "$PWD/capsule_out:/out" -e CT_OUTDIR=/out "$tag"
          test -f capsule_out/csv/psxresults.csv
          echo "artefacts produced:"; find capsule_out -type f | sort

      - name: Upload the capsule output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-output
          path: capsule_out/**
          retention-days: 90
          if-no-files-found: warn
